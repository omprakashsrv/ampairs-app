# Per-client build config for the Ambika storefront app.
# Selected at build time with: ./gradlew :clientApp:bundleRelease -Pclient=ambika
# Onboarding a new client = copy this dir to clients/<id>/, edit the values, drop in res/mipmap-*
# icons, register the applicationId in Firebase, and add its client block to google-services.json.

# Unique Play Store package name (one listing per applicationId).
applicationId=com.ampairs.app.ambika

# Home-screen / store label (manifest android:label placeholder).
appName=Ambika Enterprise

# Backend storefront/workspace slug this build is pinned to (BuildConfig.WORKSPACE_SLUG).
workspaceSlug=ambika-enterprise

# Independent versioning per client.
versionCode=2
versionName=1.0.1

# Brand seed color (ARGB). Forward-looking: wired into StorefrontTheme via a follow-up
# shared-ecom change so each client's app takes its own primary color.
themeColorArgb=0xFF1B6C4A
