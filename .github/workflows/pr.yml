name: PR Checks

# Validates every pull request BEFORE merge: compiles all three first-class KMP targets
# (Android, iOS, Desktop) and runs the test suite. The repo's own rules require compiling all
# targets after any commonMain change — this enforces it as a merge gate instead of by convention.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  android-desktop:
    name: Compile Android + Desktop, run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Write google-services.json
        # Untracked from VCS; injected from a secret. The google-services plugin runs during the
        # Android build, so the file must exist under androidApp/ even for a debug compile.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — copying template so the Android build can proceed."
            cp androidApp/google-services.json.template androidApp/google-services.json
          fi
      - run: chmod +x ./gradlew
      - name: Compile Android (debug)
        # androidApp is a com.android.application module (not a KMP library), so the KMP-style
        # compileDebugKotlinAndroid task does not exist here. assembleDebug is the canonical build
        # task and validates Kotlin compile + resource/google-services processing.
        run: ./gradlew :androidApp:assembleDebug --console=plain
      - name: Compile Desktop
        run: ./gradlew :desktopApp:compileKotlin --console=plain
      - name: Run tests
        run: ./gradlew :feature:tax:desktopTest --console=plain

  ios:
    name: Compile iOS (simulatorArm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Compile iOS framework
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --console=plain
