  # ============================
  # Build Windows MSI Installer
  # ============================
  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build MSI package
        run: ./gradlew packageMsi
        shell: bash

      - name: Find MSI file
        id: find-msi
        run: |
          $MSI_FILE = Get-ChildItem -Path "composeApp\build\compose\binaries\main\msi" -Filter "*.msi" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          echo "msi_path=$MSI_FILE" >> $env:GITHUB_OUTPUT
          echo "msi_name=$(Split-Path -Leaf $MSI_FILE)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload MSI to S3
        run: |
          $MSI_FILE = "${{ steps.find-msi.outputs.msi_path }}"
          $MSI_NAME = "${{ steps.find-msi.outputs.msi_name }}"
          $S3_BUCKET = "${{ secrets.S3_BUCKET_NAME }}"
          $S3_PATH = "releases/windows/$MSI_NAME"

          Write-Host "Uploading $MSI_NAME to S3://$S3_BUCKET/$S3_PATH"
          aws s3 cp $MSI_FILE "s3://$S3_BUCKET/$S3_PATH" --acl public-read

          $S3_URL = "https://$S3_BUCKET.s3.amazonaws.com/$S3_PATH"
          Write-Host "MSI uploaded successfully to: $S3_URL"
          echo "s3_url=$S3_URL" >> $env:GITHUB_OUTPUT
        shell: pwsh
        id: s3-upload

