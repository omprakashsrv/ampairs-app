name: Manual Release Creation

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      release_name:
        description: 'Release name (e.g., Ampairs v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ============================
  # Build macOS DMG Installer
  # ============================
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build DMG package
        run: ./gradlew desktopApp:packageDmg

      - name: Find DMG file
        id: find-dmg
        run: |
          DMG_FILE=$(find desktopApp/build/compose/binaries/main/dmg -name "*.dmg" | head -n 1)
          echo "dmg_path=$DMG_FILE" >> $GITHUB_OUTPUT
          echo "dmg_name=$(basename $DMG_FILE)" >> $GITHUB_OUTPUT

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ampairs-macOS-DMG
          path: ${{ steps.find-dmg.outputs.dmg_path }}
          retention-days: 30

  # ============================
  # Build Windows MSI Installer
  # ============================
  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build MSI package
        run: ./gradlew desktopApp:packageMsi
        shell: bash

      - name: Find MSI file
        id: find-msi
        run: |
          $MSI_FILE = Get-ChildItem -Path "desktopApp\build\compose\binaries\main\msi" -Filter "*.msi" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          echo "msi_path=$MSI_FILE" >> $env:GITHUB_OUTPUT
          echo "msi_name=$(Split-Path -Leaf $MSI_FILE)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ampairs-Windows-MSI
          path: ${{ steps.find-msi.outputs.msi_path }}
          retention-days: 30

  # ============================
  # Build Linux DEB Installer
  # ============================
  build-linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build DEB package
        run: ./gradlew desktopApp:packageDeb

      - name: Find DEB file
        id: find-deb
        run: |
          DEB_FILE=$(find desktopApp/build/compose/binaries/main/deb -name "*.deb" | head -n 1)
          echo "deb_path=$DEB_FILE" >> $GITHUB_OUTPUT
          echo "deb_name=$(basename $DEB_FILE)" >> $GITHUB_OUTPUT

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ampairs-Linux-DEB
          path: ${{ steps.find-deb.outputs.deb_path }}
          retention-days: 30

  # ============================
  # Build Android APK and AAB
  # ============================
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "y" | sdkmanager --licenses

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode and setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ampairs.jks
            echo "Keystore decoded successfully"
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 secret not set. Build may fail if signing is required."
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew androidApp:assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build Release AAB
        run: ./gradlew androidApp:bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ampairs-Android-APK
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ampairs-Android-AAB
          path: androidApp/build/outputs/bundle/release/*.aab
          retention-days: 30

  # ============================
  # Create GitHub Release
  # ============================
  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.release_name }}
          files: |
            artifacts/Ampairs-macOS-DMG/*.dmg
            artifacts/Ampairs-Windows-MSI/*.msi
            artifacts/Ampairs-Linux-DEB/*.deb
            artifacts/Ampairs-Android-APK/*.apk
            artifacts/Ampairs-Android-AAB/*.aab
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Ampairs ${{ inputs.version }}

            ### Downloads

            - **macOS**: Download the `.dmg` file
            - **Windows**: Download the `.msi` file
            - **Linux**: Download the `.deb` file
            - **Android**: Download the `.apk` file for manual installation or `.aab` for Play Store

            ### Installation Instructions

            #### macOS
            1. Download `Ampairs-*.dmg`
            2. Open the DMG file
            3. Drag Ampairs to Applications folder

            #### Windows
            1. Download `Ampairs-*.msi`
            2. Double-click to install
            3. Follow the installation wizard

            #### Linux
            1. Download `ampairs_*.deb`
            2. Install: `sudo dpkg -i ampairs_*.deb`
            3. Or double-click in file manager

            #### Android
            1. Download `Ampairs-*.apk`
            2. Enable "Install from Unknown Sources" in Settings
            3. Open APK file to install

            ---

            Built with ❤️ by Ampairs Team
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
