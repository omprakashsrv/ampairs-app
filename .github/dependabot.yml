version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      androidx:
        patterns: ["androidx.*"]
      compose-ktor:
        patterns: ["org.jetbrains.compose*", "io.ktor*", "org.jetbrains.kotlinx*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
