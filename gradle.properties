# GitHub Packages credentials — put actual values in ~/.gradle/gradle.properties, never here
# gpr.user=omprakashsrv
# gpr.key=<PAT with write:packages scope>
kotlin.code.style=official
#Gradle
org.gradle.jvmargs=-Xmx4048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4048M"
# Kotlin/Native compiler daemon (does the actual iOS framework link/compile triggered by
# Xcode's "[CP-User] Build shared" phase) is a separate JVM process from the Gradle/Kotlin
# daemons above and was falling back to a small default heap, causing
# "java.lang.OutOfMemoryError: Java heap space" while linking the framework.
# Release builds run Kotlin/Native's DevirtualizationAnalysis (whole-program optimization for
# Objective-C framework export) across all 30+ feature modules, which is far more memory-hungry
# than Debug (which skips this phase) — 6144M then 10240M both OOM'd there as the module count
# grew, so this is raised further. This phase cannot be disabled (the compiler treats it as
# required), so more heap is the only lever; on a 16GB machine, close other heavy apps (browser,
# IDEs) before archiving or this can still OOM.
kotlin.native.jvmArgs=-Xmx13312M
# org.gradle.java.home — set in ~/.gradle/gradle.properties locally, not here (breaks CI)
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#Development
org.gradle.configuration-cache=true
# Reuse task outputs across builds (local + the CI build cache restored by gradle/actions/setup-gradle)
org.gradle.caching=true
org.gradle.parallel=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.apple.xcodeCompatibility.nowarn=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
