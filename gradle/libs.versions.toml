image-loader = { module = "io.github.qdsfdhvh:image-loader", version.ref = "image-loader" }

kermit = { group = "co.touchlab", name = "kermit", version.ref = "kermit" }
google-firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics-ktx", version.ref = "firebase-crashlytics" }
google-firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics-ktx", version.ref = "firebase-analytics" }
google-firebase-perf = { group = "com.google.firebase", name = "firebase-perf-ktx", version.ref = "firebase-perf" }
