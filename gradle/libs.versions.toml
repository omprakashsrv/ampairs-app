[versions]
agp = "9.2.1"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.13.0"
# androidx.core 1.18.0+ requires compileSdk 37; this project targets compileSdk 36 (Android 16),
# so pin to the 1.17.x line which is built against API 36. Bump together with android-compileSdk.
androidx-core = "1.17.0"

compose-tooling = "1.7.6"
compose-plugin = "1.11.1"
compose-material = "1.9.0"
compose-material-icons = "1.7.3"
kotlin = "2.4.0"
ksp = "2.3.9"
androidx-room = "2.8.4"
androidx-sqlite-bundled = "2.6.2"
coil = "3.5.0"

kotlinx-dateTime = "0.8.0"
kotlinx = "1.11.0"

ktor = "3.5.0"
metro = "1.2.0"
paging-common = "3.5.0"
image-loader = "1.10.0"
splash-screen = "1.2.0"
uuid = "0.8.4"
adaptive = "1.2.0"
kermit = "2.1.0"
# Navigation 3 (new paradigm with user-owned back stack)
navigation3-ui = "1.1.1"
lifecycle-viewmodel = "2.10.0"
lifecycle-viewmodel-navigation3 = "2.10.0"
savedstate = "1.4.0"
firebase-crashlytics = "19.4.4"
