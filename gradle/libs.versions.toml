# 0.3.38, not the newer 0.3.45: the 0.3.45 jar bundles a stale 2022 libvosk native that lacks
# functions its own Java bindings declare (vosk_recognizer_set_grm, set_endpointer_*, text_processor_*),
# so JNA's Native.register fails at init on macOS/arm64. 0.3.38's Java↔native are self-consistent
# (universal arm64+x86_64 dylib) and expose every symbol VoskSpeechToText uses. (Desktop/JVM.)
vosk = "0.3.45"
# vosk-android ships a self-consistent AAR (matched Java + per-ABI .so for arm64-v8a/armeabi-v7a/x86/
# x86_64, pulls net.java.dev.jna:jna automatically) — none of the desktop arm64 native problems apply.
vosk-android = "0.3.75"
kotlinx-io = "0.9.1"
kotlincrypto-sha2 = "0.8.0"
play-services-coroutines = "1.11.0"
play-services-auth = "21.6.0"
play-integrity = "1.6.0"
app-update = "2.1.0"
billing = "9.1.0"
krossbow = "9.3.0"
firebase-bom = "34.17.0"
firebase-auth = "24.1.0"
google-services = "4.5.0"
firebase-crashlytics-gradle = "3.0.7"
firebase-perf-gradle = "2.0.2"
play-publisher = "4.0.0"
sentry-kmp = "0.27.0"
junit5 = "5.11.0"
# Testing
turbine = "1.2.1"      # Flow testing (KMP: jvm/native/js)
# Kover 0.9.2+ supports the `com.android.kotlin.multiplatform.library` plugin these modules use
# and AGP 9 (0.9.4); 0.9.1 did not (kotlinx-kover#747). Keep at >= 0.9.8.
kover = "0.9.9"

